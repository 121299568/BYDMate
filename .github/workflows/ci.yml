name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -dname "CN=BYDMate, OU=Dev, O=BYDMate, L=Shenzhen, S=Guangdong, C=CN" \
            -storepass android \
            -keypass android \
            -alias debug \
            -keystore ~/.android/debug.keystore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 || true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK with jarsigner
        run: |
          apk_file=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Signing: $apk_file"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            "$apk_file" \
            debug
          echo "Signing complete"

      - name: Verify APK signature
        run: |
          apk_file=$(ls app/build/outputs/apk/release/*.apk | head -1)
          jarsigner -verify -verbose -certs "$apk_file"
          echo "APK signed successfully!"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
