name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Create debug keystore for signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -dname "CN=BYDMate, OU=Dev, O=BYDMate, L=Shenzhen, S=Guangdong, C=CN" \
              -storepass android \
              -keypass android \
              -alias debug \
              -keystore ~/.android/debug.keystore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build release APK with auto-signing
        env:
          ANDROID_KEYSTORE_PASS: android
          ANDROID_KEY_ALIAS: debug
          ANDROID_KEY_PASS: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
