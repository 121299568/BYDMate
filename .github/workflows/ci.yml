name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -dname "CN=BYDMate, OU=Dev, O=BYDMate, L=Shenzhen, S=Guangdong, C=CN" \
            -storepass android \
            -keypass android \
            -alias debug \
            -keystore ~/.android/debug.keystore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Create keystore.properties
        run: |
          echo "storeFile=${{ github.workspace }}/.android/debug.keystore" > keystore.properties
          echo "storePassword=android" >> keystore.properties
          echo "keyAlias=debug" >> keystore.properties
          echo "keyPassword=android" >> keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
