name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -x lintDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
